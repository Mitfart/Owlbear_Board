name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          fetch-depth: 0

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stable/package-lock.json

      - name: Build stable extension
        working-directory: stable
        run: npm ci && npm run build

      - name: Build preview extension
        working-directory: preview
        run: npm ci && VITE_BASE=/Owlbear_Board/dev/ npm run build

      - name: Assemble Pages site
        run: |
          mkdir site site/dev
          cp -R stable/dist/. site/
          cp stable/manifest.json stable/icon.svg site/
          cp -R preview/dist/. site/dev/
          cp preview/manifest.json preview/icon.svg site/dev/
          sed -i 's|https://mitfart.github.io/Owlbear_Board/|https://mitfart.github.io/Owlbear_Board/dev/|' site/dev/manifest.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
